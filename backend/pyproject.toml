[project]
name = "agentscope-cs-backend"
version = "0.1.0"
description = "基于 AgentScope 2.0 的电商地垫智能客服系统后端"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.11",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
